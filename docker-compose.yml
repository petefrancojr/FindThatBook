services:
  api:
    build: ./server
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Read from .env at the repo root (see .env.example). Empty if not set.
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
    ports:
      - "5080:8080"

  web:
    build: ./client
    # Runs as usual, but its logs stay out of the `docker compose up` output. `docker compose logs web` shows them.
    attach: false
    depends_on:
      - api
    ports:
      - "4200:80"

  api-client:
    image: node:24-alpine
    profiles: ["tools"]
    depends_on:
      - api
    working_dir: /app
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
    command: >
      sh -c "npm ci --no-audit --no-fund &&
      until wget -q -O /dev/null http://api:8080/api/health; do echo waiting for api; sleep 1; done &&
      npm run api:generate"

  server-tests:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    profiles: ["test"]
    working_dir: /src
    environment:
      # Live tests call the real Gemini API. They are skipped unless LIVE_TESTS=true.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LIVE_TESTS: ${LIVE_TESTS:-false}
    volumes:
      - ./server:/src
      - nuget-cache:/root/.nuget/packages
    command: dotnet test FindThatBook.Api.Tests

  client-tests:
    image: node:24-alpine
    profiles: ["test"]
    working_dir: /app
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npx ng test --watch=false"

  e2e-tests:
    # Playwright's image ships the browsers; its version must match @playwright/test in client/package.json.
    image: mcr.microsoft.com/playwright:v1.55.0-noble
    profiles: ["test"]
    depends_on:
      - web
    working_dir: /app
    environment:
      BASE_URL: http://web
      # The browser window is shown on the Windows desktop through WSLg's X server (Docker Desktop with WSL 2).
      DISPLAY: ":0"
    volumes:
      - ./client:/app
      # Its own node_modules: the Playwright image is Ubuntu, and native packages built for Alpine won't load.
      - e2e-node-modules:/app/node_modules
      - /run/desktop/mnt/host/wslg/.X11-unix:/tmp/.X11-unix
    command: sh -c "npm ci --no-audit --no-fund && npx playwright test"

volumes:
  nuget-cache:
  client-node-modules:
  e2e-node-modules:
